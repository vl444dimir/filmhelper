<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Случайный Фильм</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
</head>
<body>
    <div class="glass-container">
        <nav class="tabs">
            <button class="tab-btn active" data-tab="randomizer"><i data-feather="film"></i> Randomizer</button>
            <button class="tab-btn" data-tab="wheel"><i data-feather="refresh-cw"></i> Колесо</button>
            <button class="tab-btn" data-tab="chatbot"><i data-feather="message-circle"></i> Чат-Бот</button>
        </nav>

        <div id="tab-randomizer" class="tab-content active">
            <h1>Movie Randomizer</h1>
            <p class="subtitle">Найди идеальный фильм на вечер</p>

            <div class="controls">
                <div class="input-group">
                    <label>Жанры (можно несколько)</label>
                    <div class="genre-chips" id="genre-chips">
                        <button class="chip" data-value="боевик">Боевик</button>
                        <button class="chip" data-value="комедия">Комедия</button>
                        <button class="chip" data-value="драма">Драма</button>
                        <button class="chip" data-value="ужасы">Ужасы</button>
                        <button class="chip" data-value="триллер">Триллер</button>
                        <button class="chip" data-value="фантастика">Фантастика</button>
                        <button class="chip" data-value="мелодрама">Мелодрама</button>
                        <button class="chip" data-value="детектив">Детектив</button>
                        <button class="chip" data-value="криминал">Криминал</button>
                        <button class="chip" data-value="биография">Биография</button>
                        <button class="chip" data-value="фэнтези">Фэнтези</button>
                        <button class="chip" data-value="документальный">Документальный</button>
                    </div>
                </div>
                <div class="input-row">
                    <div class="input-group">
                        <label for="region-select">Регион</label>
                        <select id="region-select">
                            <option value="any">Любой</option>
                            <option value="usa">США</option>
                            <option value="europe">Европа</option>
                            <option value="asia">Азия</option>
                            <option value="russia">Россия / СНГ</option>
                            <option value="other">Другие</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="rating-input">Мин. рейтинг</label>
                        <input type="number" id="rating-input" min="0" max="10" step="0.1" value="7.0">
                    </div>
                </div>
                <button id="search-btn">Найти фильм</button>
            </div>

            <div id="loader" class="loader hidden"></div>

            <div id="error-message" class="error-message hidden"></div>

            <div id="result-box" class="result-box hidden">
                <div class="poster-container">
                    <img id="movie-poster" src="" alt="Постер фильма">
                </div>
                <div class="movie-info">
                    <h2 id="movie-title">Название</h2>
                    <div class="meta">
                        <span id="movie-rating" class="rating"><i data-feather="star"></i> 0.0</span>
                        <span id="movie-date" class="date">YYYY</span>
                    </div>
                    <div class="movie-tags" id="movie-tags"></div>
                    <p id="movie-overview" class="overview">Описание</p>
                    <div id="movie-reviews" class="reviews hidden">
                        <div class="reviews-pros">
                            <div class="reviews-label"><i data-feather="thumbs-up"></i> Что хвалят</div>
                            <div class="reviews-words" id="reviews-pros"></div>
                        </div>
                        <div class="reviews-cons">
                            <div class="reviews-label"><i data-feather="thumbs-down"></i> Что ругают</div>
                            <div class="reviews-words" id="reviews-cons"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="tab-wheel" class="tab-content">
            <h1>Колесо Фортуны</h1>
            <p class="subtitle">Впиши варианты и крути!</p>

            <div class="wheel-input-row">
                <input type="text" id="wheel-input" placeholder="Например: Матрица" maxlength="40">
                <button id="wheel-add-btn"><i data-feather="plus"></i></button>
            </div>

            <div class="wheel-options-header">
                <span>Варианты (<span id="wheel-count">0</span>)</span>
                <button id="wheel-clear-btn" class="clear-btn hidden"><i data-feather="x"></i> Очистить</button>
            </div>
            <ul id="wheel-list" class="wheel-list"></ul>

            <div class="wheel-mode">
                <label class="mode-label">Режим:</label>
                <div class="mode-btns">
                    <button class="mode-btn active" data-mode="single"><i data-feather="award"></i> 1 победитель</button>
                    <button class="mode-btn" data-mode="elimination"><i data-feather="crosshair"></i> На выбывание</button>
                </div>
            </div>

            <div class="wheel-canvas-wrapper">
                <canvas id="wheel-canvas" width="400" height="400"></canvas>
                <div class="wheel-pointer">▼</div>
            </div>

            <button id="wheel-spin-btn" class="spin-btn" disabled><i data-feather="rotate-cw"></i> Крутить!</button>

            <div id="wheel-result" class="wheel-result hidden"></div>
            <div id="wheel-error" class="error-message hidden"></div>
        </div>

        <div id="tab-chatbot" class="tab-content">
            <h1>Чат-Бот</h1>
            <p class="subtitle">Опиши настроение — подберём фильмы</p>

            <div class="chat-input-row">
                <textarea id="chat-input" rows="3" placeholder="Хочется чего-то лёгкого и смешного про друзей..."></textarea>
                <button id="chat-send-btn"><i data-feather="send"></i> Спросить</button>
            </div>

            <div id="chat-loader" class="loader hidden"></div>
            <div id="chat-error" class="error-message hidden"></div>

            <div id="chat-results" class="chat-results hidden"></div>
        </div>
    </div>
    <div class="theme-toggle">
        <div id="theme-popup" class="theme-popup hidden">
            <button class="theme-option" data-theme="night" style="background: #00d2ff" title="Ночь"></button>
            <button class="theme-option" data-theme="light" style="background: #4a6fa5" title="День"></button>
            <button class="theme-option" data-theme="lavender" style="background: #c084fc" title="Лаванда"></button>
            <button class="theme-option" data-theme="emerald" style="background: #34d399" title="Изумруд"></button>
            <button class="theme-option" data-theme="sunset" style="background: #fb923c" title="Закат"></button>
        </div>
        <button id="theme-btn" class="theme-btn"><i data-feather="palette"></i></button>
    </div>
    <script src="script.js"></script>
    <script src="wheel.js"></script>
</body>
</html>
